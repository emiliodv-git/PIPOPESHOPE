<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Imagen provisional de termos PIPOPSHOP">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFEFE6"/>
      <stop offset="55%" stop-color="#FDE1CF"/>
      <stop offset="100%" stop-color="#E9F7EE"/>
    </linearGradient>
    <linearGradient id="heroBottleA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF7A52"/>
      <stop offset="100%" stop-color="#FF5A36"/>
    </linearGradient>
    <linearGradient id="heroBottleB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3FBE6B"/>
      <stop offset="100%" stop-color="#25A251"/>
    </linearGradient>
  </defs>
  <rect width="900" height="700" rx="32" fill="url(#heroBg)"/>

  <!-- termo 32oz atras, mas alto -->
  <g transform="translate(470,120)">
    <rect x="20" y="0" width="90" height="30" rx="9" fill="#14181C"/>
    <rect x="35" y="-18" width="60" height="24" rx="7" fill="#14181C"/>
    <rect x="0" y="30" width="150" height="360" rx="42" fill="url(#heroBottleB)"/>
    <rect x="0" y="190" width="150" height="52" fill="#FFFFFF" fill-opacity="0.18"/>
  </g>

  <!-- termo 24oz adelante, mas bajo -->
  <g transform="translate(280,220)">
    <rect x="18" y="0" width="80" height="26" rx="8" fill="#14181C"/>
    <rect x="32" y="-16" width="52" height="20" rx="6" fill="#14181C"/>
    <rect x="0" y="26" width="116" height="300" rx="36" fill="url(#heroBottleA)"/>
    <rect x="0" y="160" width="116" height="44" fill="#FFFFFF" fill-opacity="0.18"/>
  </g>

  <text x="450" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#14181C" fill-opacity="0.45" letter-spacing="2">IMAGEN PROVISIONAL — PIPOPSHOP</text>
</svg>
